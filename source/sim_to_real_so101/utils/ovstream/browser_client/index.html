<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fbf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11140e" media="(prefers-color-scheme: dark)" />
    <title>Train an SO-101 Robot From Sim-to-Real With NVIDIA Isaac</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-logo" viewBox="118 118 273 180" aria-hidden="true">
            <path d="M219.887 171.742v-16.233c1.576-.113 3.168-.2 4.79-.247 44.4-1.4 73.527 38.149 73.527 38.149s-31.46 43.7-65.191 43.7a40.916 40.916 0 0 1-13.126-2.1v-49.228c17.285 2.088 20.759 9.723 31.154 27.044l23.111-19.486s-16.87-22.127-45.309-22.127a83.962 83.962 0 0 0-8.956.528m0-53.625v24.248c1.593-.126 3.189-.227 4.79-.285 61.744-2.08 101.968 50.637 101.968 50.637s-46.2 56.183-94.337 56.183a71.1 71.1 0 0 1-12.421-1.093V262.8a81.731 81.731 0 0 0 10.343.67c44.795 0 77.188-22.874 108.557-49.949 5.2 4.164 26.49 14.294 30.869 18.734-29.827 24.967-99.333 45.091-138.737 45.091-3.8 0-7.449-.23-11.032-.573v21.064h170.254v-179.72zm0 116.892v12.8c-41.43-7.387-52.929-50.454-52.929-50.454s19.892-22.04 52.929-25.611v14.041c-.026 0-.042-.007-.065-.007-17.336-2.082-30.882 14.117-30.882 14.117s7.589 27.268 30.947 35.116M146.3 195.487s24.555-36.232 73.584-39.978v-13.144c-54.305 4.359-101.332 50.352-101.332 50.352s26.634 77 101.332 84.051V262.8c-54.813-6.9-73.584-67.313-73.584-67.313Z" />
          </svg>
          <div class="brand-copy">
            <h1>Train an SO-101 Robot From Sim-to-Real With NVIDIA Isaac</h1>
            <span id="task-name" class="task-name">Waiting for task&hellip;</span>
          </div>
        </div>
        <div class="topbar-actions" aria-label="Stream status">
          <label id="env-selector" class="env-selector" hidden>
            <span>Environment</span>
            <select id="env-select" aria-label="Displayed environment"></select>
          </label>
          <span id="keyboard-hint" class="pill keyboard-hint" hidden></span>
          <span id="rec-pill" class="pill rec-pill" hidden>Recording</span>
          <span id="episodes-pill" class="pill ep-pill" hidden>0 episodes</span>
          <span id="status" class="pill ready" role="status" aria-live="polite">Ready</span>
        </div>
      </header>

      <div id="dagger-controls" class="dagger-controls" hidden>
        <div class="control-row" role="status" aria-live="polite">
          <span id="control-owner" class="control-owner" hidden></span>
          <div id="control-message" hidden></div>
        </div>
        <div id="command-panel" class="command-panel" aria-label="Keyboard commands" hidden></div>
      </div>

      <div id="hint" class="hint" role="status" aria-live="polite">Connecting&hellip;</div>

      <main class="content">
        <div id="streams" class="streams"></div>

        <section class="plots" aria-label="Robot telemetry">
          <figure class="plot-card">
            <figcaption>Observations</figcaption>
            <canvas id="plot-obs"></canvas>
          </figure>
          <figure class="plot-card">
            <figcaption>Actions</figcaption>
            <canvas id="plot-act"></canvas>
          </figure>
        </section>
      </main>
    </div>

    <!-- Episode-save banner: shown while the recorder's background writer
         thread drains an episode to disk. Warns against closing mid-write. -->
    <div id="saving" class="saving-banner" role="status" aria-live="polite" hidden>
      <span class="saving-spinner"></span>
      <div class="saving-body">
        <span id="saving-text" class="saving-text">Saving episode&hellip;</span>
        <div class="saving-bar"><div id="saving-bar-fill" class="saving-bar-fill"></div></div>
      </div>
    </div>

    <!-- Hidden decode sink: the single composited WebRTC video lands here and
         each camera widget above crops its region from it into a canvas. -->
    <video id="video" class="decoder" autoplay playsinline muted tabindex="-1"></video>

    <!--
      Classic (non-module) script exposing window.OVWebRTC. Vendored verbatim
      from the ovstream SDK (examples/webrtc_client). Off-the-shelf WebRTC will
      NOT interoperate with ovstream's server; this library speaks the StreamSDK
      signaling flavor. Re-apply the window.OVWebRTC export patch on re-sync.
    -->
    <script src="./omniverse-webrtc-streaming-library.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
