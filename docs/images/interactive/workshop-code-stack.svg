<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 625" role="group" aria-labelledby="stack-title stack-desc"><title id="stack-title">The workshop code stack</title><desc id="stack-desc">Workshop code connects LeRobot controls and datasets to Isaac Lab. Isaac Lab uses Newton for physics and Omniverse libraries for camera rendering, with shared USD assets. Observations return to the controller and recorder.</desc><style>:root{--diagram-text:#222;--diagram-muted:#555;--diagram-surface:#f7f7f7;--diagram-border:#999;--diagram-accent-text:#467400}.outline{fill:var(--diagram-surface);stroke:var(--diagram-border)}.ink{fill:none;stroke:var(--diagram-text);stroke-width:2}.flow{fill:none;stroke:var(--diagram-accent-text);stroke-width:3;marker-end:url(#arrow)}text{font-family:Arial,sans-serif;fill:var(--diagram-text)}.label{font-size:22px;font-weight:bold}.detail{font-size:19px}.context{font-size:16px}.hotspot{display:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-accent-text)"/></marker></defs>
