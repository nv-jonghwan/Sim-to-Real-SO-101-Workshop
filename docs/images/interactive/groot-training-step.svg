<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="group" aria-labelledby="title desc"><title id="title">One GR00T optimizer update</title><desc id="desc">Sample a batch of observation and action windows, prepare noisy flow-matching targets, compute loss and gradients, and update trainable weights. Batch size and horizon shape the training data; trainable components and learning rate control the update.</desc><rect width="1000" height="490" fill="#111"/><style>text{font-family:Arial, sans-serif;fill:#eee}.heading{font-size:23px;font-weight:700}.detail{font-size:19px;fill:#aaa}.line{fill:none;stroke:#76b900;stroke-width:3}.arrow{fill:none;stroke:#aaa;stroke-width:3}</style>
<path class="arrow" d="M465 122 H530 M530 122 l-10 -7 m10 7 l-10 7 M755 205 V265 M755 265 l-7 -10 m7 10 l7 -10 M535 355 H475 M475 355 l10 -7 m-10 7 l10 7"/>
<rect x="20" y="20" width="440" height="205" rx="14" fill="#222" stroke="#666"/><text class="heading" x="45" y="59">1 · Sample windows</text><rect x="45" y="86" width="62" height="44" rx="4" class="line"/><rect x="55" y="96" width="62" height="44" rx="4" class="line"/><path d="M135 103 h105 m-105 15 h75 m-75 15 h95" class="line"/><text x="45" y="176" class="detail">Images + instruction + joint state</text><text x="45" y="205" class="detail">Batch size: windows per pass</text><rect x="535" y="20" width="440" height="205" rx="14" fill="#222" stroke="#666"/><text class="heading" x="560" y="59">2 · Prepare targets</text><path d="M560 106 h300" class="line"/><rect x="560" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="579" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="598" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="617" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="636" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="655" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="674" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="693" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="712" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="731" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="750" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="769" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="788" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="807" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="826" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><rect x="845" y="95" width="13" height="23" fill="#76b900" opacity=".65"/><text x="560" y="158" class="detail">Action chunk + noise → flow target</text><text x="560" y="187" class="detail">Optional image augmentation</text><rect x="535" y="275" width="440" height="205" rx="14" fill="#222" stroke="#666"/><text class="heading" x="560" y="314">3 · Compute loss</text><path d="M560 354 h75 l15 -26 l24 50 l24 -34 h75" class="line"/><text x="560" y="425" class="detail">Prediction → loss → gradients</text><text x="560" y="454" class="detail">Freeze or train selected components</text><rect x="20" y="275" width="440" height="205" rx="14" fill="#222" stroke="#666"/><text class="heading" x="45" y="314">4 · Update weights</text><path d="M55 370 l45 -35 l45 20 l50 -32" class="line"/><circle cx="55" cy="370" r="6" fill="#76b900"/><circle cx="195" cy="323" r="6" fill="#76b900"/><text x="45" y="425" class="detail">Optimizer → updated weights</text><text x="45" y="454" class="detail">Learning rate: scale the update</text></svg>