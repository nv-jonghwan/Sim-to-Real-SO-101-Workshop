<svg style="background:#fff;color:#1a1a1a;font-family:NVIDIA,Arial,Helvetica,sans-serif" role="img" xmlns="http://www.w3.org/2000/svg" id="workflow-svg" viewBox="0 0 760 816" width="760" height="816" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">An agent as a policy: observe, ask, adapt, execute</title><desc id="workflow-desc">Each control cycle the simulation pauses, the harness builds a prompt from the current observation, a demonstration, and the previous decision, the agent returns joint targets, the adapter validates and converts them, and the robot executes a short chunk before observing again.</desc><style>
.marker{font-size:16px;font-weight:700;fill:#004831;letter-spacing:.3px}
.label{font-size:25px;font-weight:700;fill:#1a1a1a}
.step-number{font-size:25px;font-weight:700;fill:#004831}
.caption{font-size:20px;fill:#666}.minor{font-size:18px;fill:#666}
.line,.accent-line,.arrow{fill:none;stroke:#666;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.accent-line{stroke:#004831}.arrow{marker-end:url(#arrow)}
.paper{fill:#fff;stroke:#666;stroke-width:2.2;stroke-linejoin:round}
.scene-back{fill:#f7f7f7;stroke:#ccc;stroke-width:1.8}
.chip-body{fill:#e9f1d9;stroke:#004831;stroke-width:2.6}
.accent-fill{fill:#004831}.muted-fill{fill:#666}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#666" stroke-width="2"/></marker></defs><text class="marker" x="20" y="24" text-anchor="start">AGENT AS POLICY</text><g class="desktop-connectors" aria-hidden="true"><path class="arrow" d="M362 158 H394"/><path class="arrow" d="M570 270 V290 H190 V308"/><path class="arrow" d="M362 420 H394"/><path class="arrow" d="M570 532 V552 H380 V570"/><path class="accent-line arrow" stroke-dasharray="6 6" d="M206 682 H8 V158 H16"/></g><g class="stage stage-1" transform="translate(20 48)"><text class="step-number" x="16" y="28" text-anchor="start">1</text><text class="label" x="48" y="28" text-anchor="start">Pause and observe</text><path class="scene-back" d="M30 56 H190 V176 H30 Z"/><path class="line" d="M38 164 H182"/><g transform="translate(50 76) scale(0.9)"><path class="accent-line" stroke-width="7" d="M20 100 V75 L50 35 L92 54 L115 24"/><circle class="paper" cx="20" cy="75" r="8"/><circle class="paper" cx="50" cy="35" r="8"/><circle class="paper" cx="92" cy="54" r="7"/><path class="line" d="M8 106 H37 M108 18 L121 30 M117 26 L129 18 L135 25 M117 26 L108 38 L114 43"/></g><rect class="muted-fill" x="164" y="64" width="5" height="16"/><rect class="muted-fill" x="173" y="64" width="5" height="16"/><path class="line" d="M192 116 H206"/><rect class="paper" x="208" y="52" width="108" height="38" rx="4"/><text class="minor" x="262" y="77" text-anchor="middle">External</text><rect class="paper" x="208" y="96" width="108" height="38" rx="4"/><text class="minor" x="262" y="121" text-anchor="middle">Wrist</text><rect class="chip-body" x="208" y="140" width="108" height="36" rx="4" stroke-width="2"/><text class="minor" x="262" y="164" text-anchor="middle">q[6] joints</text><text class="caption" x="170" y="205" text-anchor="middle">The simulation pauses here</text></g><g class="stage stage-2" transform="translate(400 48)"><text class="step-number" x="16" y="28" text-anchor="start">2</text><text class="label" x="48" y="28" text-anchor="start">Build the prompt</text><rect class="paper" x="30" y="54" width="176" height="34" rx="4"/><text class="minor" x="42" y="78" text-anchor="start">Task</text><rect class="paper" x="30" y="96" width="176" height="34" rx="4"/><text class="minor" x="42" y="120" text-anchor="start">Recorded demo</text><rect class="paper" x="30" y="138" width="176" height="34" rx="4"/><text class="minor" x="42" y="162" text-anchor="start">Previous decision</text><path class="line" d="M208 71 H226 M208 113 H226 M208 155 H226"/><path class="paper" d="M228 52 H300 L316 68 V176 H228 Z"/><path class="line" d="M300 52 V68 H316"/><path class="accent-line" stroke-width="2.2" d="M240 88 H304 M240 106 H304 M240 124 H292 M240 142 H304 M240 160 H284"/><text class="caption" x="170" y="205" text-anchor="middle">Context travels with each request</text></g><g class="stage stage-3" transform="translate(20 310)"><text class="step-number" x="16" y="28" text-anchor="start">3</text><text class="label" x="48" y="28" text-anchor="start">Ask the agent</text><rect class="paper" x="24" y="60" width="92" height="104" rx="10"/><text class="minor" x="70" y="118" text-anchor="middle">Local</text><rect class="chip-body" x="214" y="60" width="102" height="104" rx="10"/><text class="label" x="265" y="108" text-anchor="middle">Agent</text><text class="minor" x="265" y="136" text-anchor="middle">Remote</text><path class="arrow" d="M120 88 H208"/><path class="arrow" d="M208 138 H120"/><text class="minor" x="164" y="80" text-anchor="middle">request</text><text class="minor" x="164" y="162" text-anchor="middle">targets</text><text class="caption" x="170" y="205" text-anchor="middle">The simulation waits for inference</text></g><g class="stage stage-4" transform="translate(400 310)"><text class="step-number" x="16" y="28" text-anchor="start">4</text><text class="label" x="48" y="28" text-anchor="start">Check and adapt</text><path class="line" stroke-dasharray="5 5" d="M32 160 L62 100 L108 118 L146 70"/><circle class="paper" cx="32" cy="160" r="7"/><circle class="paper" cx="62" cy="100" r="7"/><circle class="paper" cx="108" cy="118" r="7"/><circle class="paper" cx="146" cy="70" r="7"/><path class="arrow" d="M156 120 H184"/><path class="accent-line" stroke-width="2" d="M190 160 C215 80 255 150 316 70"/><circle class="accent-fill" cx="190" cy="160" r="3"/><circle class="accent-fill" cx="197" cy="143" r="3"/><circle class="accent-fill" cx="204" cy="131" r="3"/><circle class="accent-fill" cx="212" cy="123" r="3"/><circle class="accent-fill" cx="220" cy="119" r="3"/><circle class="accent-fill" cx="229" cy="116" r="3"/><circle class="accent-fill" cx="240" cy="115" r="3"/><circle class="accent-fill" cx="250" cy="114" r="3"/><circle class="accent-fill" cx="262" cy="111" r="3"/><circle class="accent-fill" cx="274" cy="107" r="3"/><circle class="accent-fill" cx="287" cy="99" r="3"/><circle class="accent-fill" cx="301" cy="87" r="3"/><circle class="accent-fill" cx="316" cy="70" r="3"/><text class="caption" x="170" y="205" text-anchor="middle">Validate, interpolate, convert</text></g><g class="stage stage-5" transform="translate(210 572)"><text class="step-number" x="16" y="28" text-anchor="start">5</text><text class="label" x="48" y="28" text-anchor="start">Execute, then repeat</text><g transform="translate(24 60) scale(0.95)"><path class="accent-line" stroke-width="7" d="M20 100 V75 L50 35 L92 54 L115 24"/><circle class="paper" cx="20" cy="75" r="8"/><circle class="paper" cx="50" cy="35" r="8"/><circle class="paper" cx="92" cy="54" r="7"/><path class="line" d="M8 106 H37 M108 18 L121 30 M117 26 L129 18 L135 25 M117 26 L108 38 L114 43"/></g><path class="line" d="M190 86 H316 M190 78 V94 M211 78 V94 M232 78 V94 M253 78 V94 M274 78 V94 M295 78 V94 M316 78 V94"/><path class="accent-line" d="M190 110 H316 M190 102 V118 M316 102 V118"/><text class="minor" x="253" y="136" text-anchor="middle">H steps</text><text class="minor" x="253" y="66" text-anchor="middle">control steps</text><rect class="paper" x="190" y="148" width="126" height="32" rx="4" stroke-dasharray="5 4"/><text class="minor" x="253" y="171" text-anchor="middle">Evaluator logs</text><text class="caption" x="170" y="205" text-anchor="middle">Then observe again</text></g></svg>