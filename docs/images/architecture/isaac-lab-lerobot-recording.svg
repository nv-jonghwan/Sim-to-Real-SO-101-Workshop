<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="760" viewBox="0 0 1560 760" role="group" aria-labelledby="title description">
<title id="title">Isaac Lab · LeRobot teleoperation and recording</title>
<desc id="description">The loop is paced at 30 Hz, recording 30 frames per second. The real leader arm supplies motor positions through lerobot_interface to lerobot_agent, which drives the simulated environment. Simulated joint state and camera images return to the agent. The recorder pairs each current observation with the next leader action and saves episodes as a LeRobot dataset.</desc>
