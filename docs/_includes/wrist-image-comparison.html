<section class="image-comparison" aria-labelledby="wrist-comparison-title">
  <h4 id="wrist-comparison-title">Saved wrist images: real and simulated</h4>
  <div class="image-comparison-controls" hidden>
    <label>View <select data-control="mode"><option value="overlay">Overlay</option><option value="side">Side by side</option><option value="real">Real only</option><option value="sim">Sim only</option></select></label>
    <label>Sim opacity <input data-control="opacity" type="range" min="0" max="100" value="50" aria-label="Simulation opacity"><output data-control="value">50%</output></label>
    <button data-control="toggle" type="button">Toggle real / sim</button>
    <button data-control="reset" type="button">Reset example</button>
    <label>Load real image <input data-control="real-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <label>Load sim image <input data-control="sim-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
  </div>
  <p class="image-comparison-status" role="status" aria-live="polite">Real image on the left; simulation on the right. Both are 640 × 480.</p>
  <div class="image-comparison-stage" data-mode="side">
    <figure data-image="real"><img src="_static/wrist-comparison/real.jpg" width="640" height="480" alt="Real wrist image with orange gripper fingers, a yellow rack at the left, and a wrapped vial on a dark mat."><figcaption>Real</figcaption></figure>
    <figure data-image="sim"><img src="_static/wrist-comparison/sim-perception-dr.png" width="640" height="480" alt="Perception-DR wrist image at the saved native joint angles, with perception materials, camera response, and reset-time wrist blur."><figcaption>Simulation · Perception-DR</figcaption></figure>
  </div>
  <p>This example shows perceptual differences between simulation and reality for our vial-to-rack task. <strong>What do you notice is different?</strong></p>
  <noscript><p>Enable JavaScript for the opacity slider and local image selection. The two saved example images remain visible without it.</p></noscript>
</section>
